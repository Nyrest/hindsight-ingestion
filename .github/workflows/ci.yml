name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
      SQLSOURCE_TEST_MYSQL_DSN: "root:sql-test-password@tcp(127.0.0.1:3306)/sql_source_test?parseTime=true"
      SQLSOURCE_TEST_POSTGRES_DSN: "postgres://postgres:sql-test-password@127.0.0.1:5432/sql_source_test?sslmode=disable"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sql-test-password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: sql_source_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psql-test-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: sql-test-password
          POSTGRES_DB: sql_source_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sql_source_test"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.x"

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Configure database TLS for integration tests
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          TLS_DIR="$RUNNER_TEMP/sql-source-tls"
          CA_FILE="$TLS_DIR/cert.pem"
          mkdir -p "$TLS_DIR"
          echo "SQLSOURCE_TEST_CA=$CA_FILE" >> "$GITHUB_ENV"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=localhost -addext subjectAltName=DNS:localhost,IP:127.0.0.1 \
            -keyout "$TLS_DIR/key.pem" -out "$CA_FILE"
          docker cp "$CA_FILE" "$MYSQL_CONTAINER:/var/lib/mysql/ca.pem"
          docker cp "$CA_FILE" "$MYSQL_CONTAINER:/var/lib/mysql/server-cert.pem"
          docker cp "$TLS_DIR/key.pem" "$MYSQL_CONTAINER:/var/lib/mysql/server-key.pem"
          docker exec "$MYSQL_CONTAINER" chown mysql:mysql /var/lib/mysql/ca.pem /var/lib/mysql/server-cert.pem /var/lib/mysql/server-key.pem
          docker exec "$MYSQL_CONTAINER" chmod 600 /var/lib/mysql/server-key.pem
          docker exec "$MYSQL_CONTAINER" mysql -uroot -psql-test-password -e 'ALTER INSTANCE RELOAD TLS;'
          docker cp "$CA_FILE" "$POSTGRES_CONTAINER:/var/lib/postgresql/data/server.crt"
          docker cp "$TLS_DIR/key.pem" "$POSTGRES_CONTAINER:/var/lib/postgresql/data/server.key"
          docker exec "$POSTGRES_CONTAINER" chown postgres:postgres /var/lib/postgresql/data/server.crt /var/lib/postgresql/data/server.key
          docker exec "$POSTGRES_CONTAINER" chmod 600 /var/lib/postgresql/data/server.key
          docker exec -u postgres "$POSTGRES_CONTAINER" psql -d sql_source_test -c "ALTER SYSTEM SET ssl = 'on';"
          docker exec -u postgres "$POSTGRES_CONTAINER" psql -d sql_source_test -c 'SELECT pg_reload_conf();'

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Test frontend
        working-directory: frontend
        run: bun test

      - name: Build backend
        working-directory: backend
        run: go build ./...

      - name: Vet backend
        working-directory: backend
        run: go vet ./...

      - name: Test backend
        working-directory: backend
        run: go test ./...

  docker:
    name: Build Docker image (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          pull: true
          outputs: type=oci,dest=${{ runner.temp }}/hindsight-ingestion.tar
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}
